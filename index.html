<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Google Fonts: Quicksand & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #FF6584;
      --secondary: #10B981;
      --accent: #F59E0B;
      --blue: #3B82F6;
      --purple: #8B5CF6;
      --dark: #1E293B;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FFE4E6 0%, #E0F2FE 50%, #EDE9FE 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      color: var(--dark);
    }
    .font-cute {
      font-family: 'Quicksand', cursive, sans-serif;
    }
    #app-container {
      background: rgba(255, 255, 255, 0.98);
      width: 100%;
      max-width: 1120px;
      min-height: 780px;
      border-radius: 36px;
      box-shadow: 0 24px 60px rgba(244, 114, 182, 0.2);
      border: 6px solid #FFF;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .card-hover {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-hover:hover {
      transform: translateY(-5px) scale(1.02);
    }
    .btn-bounce:active {
      transform: scale(0.95);
    }
    .mic-recording {
      animation: pulse-red 1.2s infinite;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
    }
    @keyframes pulse-red {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .seq-box {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: #FFF;
      border: 3px solid #3B82F6;
      color: #1D4ED8;
      font-size: 22px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #2563EB;
    }
    .seq-box.target {
      background: #FEF3C7;
      border-color: #F59E0B;
      color: #D97706;
      box-shadow: 0 4px 0 #D97706;
      animation: pulse-target 1.4s infinite;
    }
    @keyframes pulse-target {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .word-chip {
      display: inline-block;
      padding: 6px 14px;
      margin: 4px;
      border-radius: 16px;
      font-size: 26px;
      font-weight: 900;
      background: #FFF;
      border: 3px solid #E2E8F0;
      transition: all 0.2s;
    }
    .word-chip.match {
      background: #DCFCE7;
      color: #166534;
      border-color: #22C55E;
      box-shadow: 0 4px 0 #16A34A;
    }
    .word-chip.mismatch {
      background: #FEE2E2;
      color: #991B1B;
      border-color: #EF4444;
      box-shadow: 0 4px 0 #DC2626;
    }
    .choice-ipa {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-style: italic;
      font-size: 13px;
      font-weight: 600;
      opacity: 0.85;
    }
    .letter-btn {
      width: 54px;
      height: 54px;
      font-size: 26px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      transition: all 0.2s;
    }
    .slot-word-btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 18px;
      min-width: 76px;
      transition: all 0.2s;
    }
    .vocab-pill-red {
      background-color: #FFE4E6;
      color: #E11D48;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 8px;
      display: inline-block;
      margin: 0 2px;
      border: 1px solid #FECDD3;
    }

<body>

    <!-- 0. MÀN HÌNH BẮT ĐẦU VÀO HỌC -->
    <div id="start-overlay" class="absolute inset-0 bg-gradient-to-br from-pink-500/95 via-rose-400/95 to-purple-600/95 z-50 flex flex-col items-center justify-center p-6 text-center text-white">

        🐰
      </div>
      <h1 class="text-3xl md:text-4xl font-black font-cute mb-3">🌸 VƯỜN TRI THỨC LỚP 2 🌸</h1>
      <p class="text-base md:text-lg font-bold max-w-lg mb-6 leading-relaxed text-pink-100">
        Chào bạn nhỏ đáng yêu! Chúc con có một buổi học thật vui vẻ và rinh triệu ngôi sao điểm 10 nhé! ✨
      </p>
      <button onclick="initAppAudio()" class="btn-bounce bg-amber-300 hover:bg-amber-200 text-amber-900 text-2xl md:text-3xl font-black px-10 py-4 md:py-5 rounded-full shadow-2xl border-4 border-white transition flex items-center space-x-3">

    <!-- HEADER: NAV + TIÊU ĐỀ CHÍNH GIỮA + SAO THƯỞNG -->

      <div class="flex items-center space-x-2">
        <button onclick="goHome()" class="btn-bounce bg-pink-50 hover:bg-pink-100 text-pink-600 border-2 border-pink-200 font-extrabold px-3 py-1.5 rounded-2xl text-xs md:text-sm flex items-center space-x-1 shadow-sm">
          <span>🏠 Trang chủ</span>
        </button>
        <button id="btn-back-subject" onclick="renderCurrentSubjectMenu()" class="btn-bounce bg-gray-100 hover:bg-gray-200 text-gray-700 border-2 border-gray-200 font-extrabold px-3 py-1.5 rounded-2xl text-xs md:text-sm hidden flex items-center space-x-1 shadow-sm">

          <span class="bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 bg-clip-text text-transparent">VƯỜN TRI THỨC LỚP 2</span>

    <!-- KHÔNG GIAN NỘI DUNG CHÍNH -->
    <main id="main-content" class="flex-1 p-4 md:p-6 flex flex-col items-center justify-center text-center overflow-y-auto">
      <!-- Dynamic Content -->
    </main>

  </div>

  <script>
    /* ========================================================
       1. ÂM THANH & VOICE SYNTHESIS
       ======================================================== */
    let stars = parseInt(localStorage.getItem('stars_vtt_lop2') || '0');
    let currentSubject = null;
    let currentMode = null;
    let currentAnswer = null;
    let currentFullSentence = null;
    let currentReadingTarget = null;
    let currentVocabTarget = null;
    let currentTopicId = null;
    let audioCtx = null;
    const onlineAudioPlayer = new Audio();

    document.getElementById('stars-count').innerText = stars;

    const WELCOME_GREETINGS = [
      "Chào bạn nhỏ đáng yêu! Chúc con có một buổi học thật vui và rinh thật nhiều ngôi sao xinh nhé!",
      "Chào công chúa nhỏ! Hôm nay chúng mình cùng học Toán, Tiếng Anh và Tiếng Việt thật giỏi nhé!",
      "Chào bé yêu! Thỏ trắng rất vui được đồng hành cùng con trong Vườn Tri Thức Lớp 2!"
    ];

    function initAppAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }
      playTone('correct');
      const greet = WELCOME_GREETINGS[Math.floor(Math.random() * WELCOME_GREETINGS.length)];
      speakClear(greet, "vi");
      document.getElementById('start-overlay').style.display = 'none';
      goHome();
    }

    function playTone(type) {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(180, now + 0.22);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    function speakClear(text, lang = 'vi', onEndCallback = null) {
      try {
        onlineAudioPlayer.pause();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();

        const targetLang = (lang === 'en' || lang === 'en-US') ? 'en' : 'vi';
        let cleanText = String(text || '');
        if (targetLang === 'vi') {
          cleanText = cleanText.replace(/\+/g, ' cộng ')
                               .replace(/-/g, ' trừ ')
                               .replace(/×/g, ' nhân ')
                               .replace(/:/g, ' chia ')
                               .replace(/=/g, ' bằng ')
                               .replace(/dm/g, ' đề xi mét ')
                               .replace(/cm/g, ' xăng ti mét ')
                               .replace(/kg/g, ' ki lô gam ');
        }

        const encoded = encodeURIComponent(cleanText.trim());
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${targetLang}&client=tw-ob&q=${encoded}`;

        onlineAudioPlayer.src = ttsUrl;
        onlineAudioPlayer.playbackRate = 0.92;
        
        onlineAudioPlayer.onended = () => {
          if (typeof onEndCallback === 'function') onEndCallback();
        };

        const playPromise = onlineAudioPlayer.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            fallbackWebSpeech(cleanText, targetLang, onEndCallback);
          });
        }
      } catch (err) {
        fallbackWebSpeech(text, lang, onEndCallback);
      }
    }

    function fallbackWebSpeech(text, lang, onEndCallback = null) {
      if (!('speechSynthesis' in window)) {
        if (typeof onEndCallback === 'function') onEndCallback();
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.88;
      utterance.pitch = 1.1;
      utterance.lang = (lang === 'vi' || lang === 'vi-VN') ? 'vi-VN' : 'en-US';
      utterance.onend = () => {
        if (typeof onEndCallback === 'function') onEndCallback();
      };
      window.speechSynthesis.speak(utterance);
    }

    function speakMascotCheer() {
      const cheers = [
        "Bé yêu học chăm chỉ và giỏi giang quá!",
        "Cố lên bạn nhỏ, mỗi câu trả lời đúng là một ngôi sao sáng lấp lánh!",
        "Thỏ trắng chúc bé học thật vui và rinh thật nhiều điểm 10 nhé!"
      ];
      const randomCheer = cheers[Math.floor(Math.random() * cheers.length)];
      speakClear(randomCheer, "vi");
    }

    function addStars(num) {
      stars += num;
      localStorage.setItem('stars_vtt_lop2', stars);
      document.getElementById('stars-count').innerText = stars;
      confetti({ particleCount: 60, spread: 80, origin: { y: 0.75 } });
    }

    /* ========================================================
       2. HỆ THỐNG HÀNG ĐỢI XÁO TRỘN TUẦN HOÀN (KHÔNG TRÙNG LẶP)
       ======================================================== */
    const QUEUE_SYSTEM = {};

    function getNextItemFromPool(poolKey, rawDataArray) {
      if (!QUEUE_SYSTEM[poolKey] || QUEUE_SYSTEM[poolKey].length === 0) {
        const shuffled = [...rawDataArray];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        QUEUE_SYSTEM[poolKey] = shuffled;
      }
      return QUEUE_SYSTEM[poolKey].pop();
    }

      { letter: 'H', nameIpa: '/eɪtʃ/', soundIpa: '/h/', word: 'Hat', wordIpa: '/hæt/', vi: 'Cái mũ', emoji: '👒', sample: 'H is for Hat /h/ /h/ Hat' },

    /* ========================================================
       4. 10 CHỦ ĐỀ TỪ VỰNG TIẾNG ANH LỚP 1 + 2
       ======================================================== */
    const ENG_TOPICS = [
      { id: 'school', title: '1. School Things', viTitle: 'Đồ dùng học tập', icon: '🎒', desc: 'Bút, thước, sách, cặp, bàn ghế...' },

    function getIPA(word) {
      if (!word) return '';
      const found = ENG_VOCAB_MASTER.find(v => v.word.toLowerCase() === word.toLowerCase());
      if (found) return found.ipa;
      if (EXTRA_IPA[word] || EXTRA_IPA[word.toLowerCase()]) return EXTRA_IPA[word] || EXTRA_IPA[word.toLowerCase()];
      const clean = word.replace(/[^a-zA-Z]/g, '').toLowerCase();
      const fallback = ENG_VOCAB_MASTER.find(v => v.word.toLowerCase() === clean);
      return fallback ? fallback.ipa : (EXTRA_IPA[clean] || '');
    }

    function highlightWordInSentence(sentence, targetWord) {
      if (!sentence || !targetWord) return sentence;
      const regex = new RegExp(`\\b(${targetWord}[a-z]*)\\b`, 'gi');
      return sentence.replace(regex, `<span class="vocab-pill-red">$1</span>`);
    }

        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-7 gap-2.5 w-full max-w-5xl max-h-[500px] overflow-y-auto p-2 bg-amber-50/40 rounded-3xl border-2 border-dashed border-amber-200 mb-3">
          ${cardsHtml}

        <div class="flex items-center justify-center gap-3">
          <button onclick="startAlphabetPhonicsQuiz()" class="btn-bounce bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-black text-sm md:text-base px-6 py-2.5 rounded-2xl shadow-md flex items-center gap-2 transition">
            <span>🎮 Luyện Tập Trắc Nghiệm Âm IPA</span>
            <i class="fa-solid fa-gamepad"></i>

    function playPhonicsCard(index) {
      const item = ENG_ALPHABET_PHONICS[index];
      if (!item) return;
      playTone('correct');
      speakClear(item.letter + ". " + item.word, "en");
    }

    function startAlphabetPhonicsQuiz() {
      currentMode = 'alphabetQuiz';
      btnBackSubject.classList.remove('hidden');
      const q = getNextItemFromPool('pool_alphabetQuiz', ENG_ALPHABET_PHONICS);
      currentAnswer = q.letter;

      let choices = [q.letter];
      const otherLetters = ENG_ALPHABET_PHONICS.filter(a => a.letter !== q.letter);
      while (choices.length < 4) {
        let r = otherLetters[Math.floor(Math.random() * otherLetters.length)].letter;
        if (!choices.includes(r)) choices.push(r);
      }
      choices.sort(() => Math.random() - 0.5);

      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>Nghe và chọn chữ cái đúng:</span>
          <button class="btn-bounce bg-amber-100 hover:bg-amber-200 text-amber-800 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.letter}', 'en')">🔊 Nghe lại âm</button>

        <div class="bg-amber-50/50 border-2 border-dashed border-amber-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">

              ${c}
            </button>
          `).join('')}
        </div>
      `;
      speakClear(q.letter, "en");
    }

    /* ========================================================
       6.2 10 CHỦ ĐỀ TỪ VỰNG TIẾNG ANH
       ======================================================== */
    function openEngTopicsMenu() {
      currentMode = 'engTopicsMenu';
      btnBackSubject.classList.remove('hidden');
      
      const topicsHtml = ENG_TOPICS.map(t => {
        const count = ENG_VOCAB_MASTER.filter(v => v.topicId === t.id).length;

            </div>

          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="mb-4">
          <h2 class="text-2xl md:text-3xl font-black text-pink-600 font-cute">🌈 10 CHỦ ĐỀ TỪ VỰNG TIẾNG ANH LỚP 1 + 2</h2>
          <p class="text-xs md:text-sm font-bold text-gray-500 mt-1">Bé hãy chọn một chủ đề bên dưới để khám phá kho từ vựng phong phú & ví dụ nhé!</p>

          ${topicsHtml}

    }

    function selectVocabTopic(topicId) {
      currentTopicId = topicId;
      vocabHistory = [];
      vocabHistoryIndex = -1;
      startEngVocabMasterGame(null, false);
    }

    let vocabHistory = [];
    let vocabHistoryIndex = -1;

    function startEngVocabMasterGame(targetWordObj = null, isNav = false) {
      currentMode = 'engVocabMaster';
      btnBackSubject.classList.remove('hidden');

      const topicPool = currentTopicId 
        ? ENG_VOCAB_MASTER.filter(v => v.topicId === currentTopicId)
        : ENG_VOCAB_MASTER;

      let target;
      if (targetWordObj) {
        target = targetWordObj;
      } else if (vocabHistoryIndex >= 0 && vocabHistoryIndex < vocabHistory.length - 1 && isNav) {
        vocabHistoryIndex++;
        target = vocabHistory[vocabHistoryIndex];
      } else {
        const poolKey = 'pool_engVocab_' + (currentTopicId || 'all');
        target = getNextItemFromPool(poolKey, topicPool);
        vocabHistory.push(target);
        vocabHistoryIndex = vocabHistory.length - 1;
      }

      currentVocabTarget = target;
      currentAnswer = target.word;

      let choices = [target.word];
      const otherVocab = ENG_VOCAB_MASTER.filter(v => v.word !== target.word);
      while (choices.length < 4 && otherVocab.length > 0) {
        let r = otherVocab[Math.floor(Math.random() * otherVocab.length)].word;
        if (!choices.includes(r)) choices.push(r);
      }
      choices.sort(() => Math.random() - 0.5);

      const curTopicObj = ENG_TOPICS.find(t => t.id === target.topicId);
      const topicNameDisplay = curTopicObj ? `${curTopicObj.icon} ${curTopicObj.title} (${curTopicObj.viTitle})` : target.cat;

      container.innerHTML = `
        <div class="text-base md:text-xl font-black text-gray-800 mb-2 flex flex-wrap items-center justify-center gap-2">
          <span class="bg-pink-100 text-pink-700 px-3 py-1 rounded-xl text-xs font-black">${topicNameDisplay}</span>
          <span>Chọn từ tiếng Anh đúng:</span>
          <button id="btn-speak-meaning" class="btn-bounce bg-blue-50 hover:bg-blue-100 text-blue-700 border-2 border-blue-200 text-xs md:text-sm font-black px-3 py-1 rounded-2xl flex items-center gap-1.5 shadow-sm">
            <span>🔊 Nghĩa: ${target.vi}</span>
          </button>
        </div>

        <div class="bg-pink-50/50 border-2 border-dashed border-pink-200 rounded-3xl p-4 w-full max-w-4xl mb-3">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
            <div id="vocab-left-box" class="md:col-span-5 flex flex-col items-center justify-center bg-white/95 rounded-2xl p-4 border border-pink-100 shadow-sm min-h-[190px]">
              <div class="text-6xl md:text-7xl mb-2 transform hover:scale-110 transition duration-300">${target.emoji}</div>
              <div class="text-xl md:text-2xl font-black text-gray-800 mb-1">Nghĩa: ${target.vi}</div>
              <div class="choice-ipa text-sm font-extrabold text-blue-600 bg-blue-50 border border-blue-200 px-3 py-0.5 rounded-xl mb-1">${target.word} ${target.ipa}</div>
              <div class="text-[11px] font-bold text-gray-400">Chủ đề: ${target.cat}</div>
            </div>

            <div id="vocab-examples-container" class="md:col-span-7 flex flex-col justify-center min-h-[190px]">
              <div class="border-2 border-dashed border-pink-200 bg-white/60 rounded-2xl p-5 text-center text-gray-400 font-bold italic flex flex-col items-center justify-center h-full">
                <span class="text-3xl mb-1">💡</span>
                <span>Bé hãy chọn từ tiếng Anh đúng ở dưới để khám phá 3 câu ví dụ nhé!</span>
              </div>
            </div>
          </div>
        </div>

        <div id="vocab-choices-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 w-full max-w-4xl mb-3">
          ${renderEngChoiceButtons(choices)}
        </div>

        <div class="flex items-center justify-center space-x-4">
          <button onclick="prevVocabWord()" class="btn-bounce bg-sky-50 hover:bg-sky-100 text-sky-600 border-2 border-sky-300 font-black text-base px-5 py-2 rounded-2xl shadow-sm flex items-center space-x-2 transition ${vocabHistoryIndex <= 0 ? 'opacity-40 cursor-not-allowed' : ''}" ${vocabHistoryIndex <= 0 ? 'disabled' : ''}>
            <i class="fa-solid fa-arrow-left"></i>
            <span>Từ trước (Prev)</span>
          </button>
          <button onclick="nextVocabWord()" class="btn-bounce bg-amber-400 hover:bg-amber-500 text-amber-900 border-2 border-amber-500 font-black text-base px-6 py-2 rounded-2xl shadow-md flex items-center space-x-2 transition">
            <span>Từ tiếp theo (Next)</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      `;

      document.getElementById('btn-speak-meaning').onclick = () => speakClear("Nghĩa là: " + target.vi, 'vi');
      speakClear(target.vi, 'vi');
    }

    function renderVocabExamples(target) {
      const exContainer = document.getElementById('vocab-examples-container');
      if (!exContainer || !target || !target.examples) return;

      const examplesHtml = target.examples.map((ex, idx) => {
        const highlightedEn = highlightWordInSentence(ex.en, target.word);
        return `
          <div class="bg-white border-2 border-slate-100 rounded-2xl p-2.5 mb-2 shadow-sm flex items-center justify-between text-left transform transition hover:scale-[1.01]">
            <div class="pr-2">
              <div class="text-sm md:text-base font-extrabold text-slate-800 leading-snug">${highlightedEn}</div>
              <div class="text-xs font-bold text-slate-400 leading-tight mt-0.5">${ex.vi}</div>
            </div>
            <button onclick="speakExample(${idx})" class="btn-bounce flex-shrink-0 bg-blue-50 hover:bg-blue-100 text-blue-500 w-8 h-8 rounded-xl flex items-center justify-center shadow-sm border border-blue-200 ml-2" title="Nghe câu này">
              <i class="fa-solid fa-volume-high text-xs"></i>
            </button>
          </div>
        `;
      }).join('');

      exContainer.innerHTML = `
        <div class="bg-amber-50/50 border border-amber-200/80 rounded-2xl p-3 shadow-inner text-left">
          <div class="text-xs font-black text-amber-600 uppercase tracking-wider mb-1.5 flex items-center space-x-1.5">
            <span>☀️ 3 Câu ví dụ tiếng Anh:</span>
          </div>
          ${examplesHtml}
        </div>
      `;
    }

    function speakExample(index) {
      if (currentVocabTarget && currentVocabTarget.examples && currentVocabTarget.examples[index]) {
        speakClear(currentVocabTarget.examples[index].en, 'en');
      }
    }

    function prevVocabWord() {
      if (vocabHistoryIndex > 0) {
        vocabHistoryIndex--;
        startEngVocabMasterGame(vocabHistory[vocabHistoryIndex], true);
      }
    }

    function nextVocabWord() {
      if (vocabHistoryIndex < vocabHistory.length - 1) {
        vocabHistoryIndex++;
        startEngVocabMasterGame(vocabHistory[vocabHistoryIndex], true);
      } else {
        startEngVocabMasterGame(null, false);
      }
    }

    function renderEngChoiceButtons(choices) {
      return choices.map(c => {
        const ipa = getIPA(c);
        return `
          <button class="btn-bounce bg-white border-4 border-emerald-400 hover:bg-emerald-50 text-emerald-800 font-black py-2.5 px-3 rounded-2xl shadow-md transition flex flex-col items-center justify-center min-h-[68px]" onclick="checkChoiceAnswer(this, '${c}')">
            <span class="text-base md:text-lg font-extrabold">${c}</span>
            ${ipa ? `<span class="choice-ipa text-emerald-600 mt-0.5 text-xs">${ipa}</span>` : ''}
          </button>
        `;
      }).join('');
    }

    // Voice AI Reading
    const ENG_READING_BANK = [
      { text: "cat", ipa: "/kæt/", meaning: "con mèo", emoji: "🐱" },
      { text: "dog", ipa: "/dɒɡ/", meaning: "con chó", emoji: "🐶" },
      { text: "elephant", ipa: "/ˈelɪfənt/", meaning: "con voi", emoji: "🐘" },
      { text: "pencil", ipa: "/ˈpensəl/", meaning: "bút chì", emoji: "✏️" },
      { text: "This is my mother", ipa: "/ðɪs ɪz maɪ ˈmʌðər/", meaning: "Đây là mẹ của tôi", emoji: "👩" },
      { text: "I have a pink pencil", ipa: "/aɪ hæv ə pɪŋk ˈpensəl/", meaning: "Tôi có một chiếc bút chì màu hồng", emoji: "✏️" }
    ];

    let recognition = null;
    let isRecording = false;

    function startEngReadingGame() {
      currentMode = 'engReading';
      btnBackSubject.classList.remove('hidden');
      const q = getNextItemFromPool('pool_engReading', ENG_READING_BANK);
      currentReadingTarget = q;
      const words = q.text.split(' ');
      const wordsHtml = words.map((w, idx) => `<span class="word-chip" id="word-${idx}">${w}</span>`).join(' ');

      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>Bé đọc to từ hoặc câu tiếng Anh bên dưới nhé!</span>
          <button class="btn-bounce bg-purple-100 hover:bg-purple-200 text-purple-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.text}', 'en')">🔊 Nghe mẫu</button>
        </div>
        <div class="bg-pink-50/50 border-2 border-dashed border-pink-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="text-7xl mb-3">${q.emoji}</div>
          <div class="mb-1" id="words-container">${wordsHtml}</div>
          <div class="choice-ipa text-base font-extrabold text-pink-600 bg-pink-100/70 border border-pink-200 px-3 py-1 rounded-xl mb-2">${q.ipa}</div>
          <div class="text-sm font-extrabold text-gray-500">Nghĩa tiếng Việt: <b class="text-pink-600">${q.meaning}</b></div>
          <div id="reading-feedback" class="mt-3 text-base font-black min-h-[28px]"></div>
        </div>
        <button id="record-btn" onclick="toggleVoiceRecording()" class="btn-bounce bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-black text-xl px-10 py-4 rounded-full shadow-lg flex items-center gap-3 transition">
          <i class="fa-solid fa-microphone text-2xl"></i>
          <span>Bấm để đọc (Speak)</span>
        </button>
      `;
    }

    function toggleVoiceRecording() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recordBtn = document.getElementById('record-btn');
      const feedback = document.getElementById('reading-feedback');

      if (!SpeechRecognition) {
        feedback.innerHTML = `<span class="text-rose-600">Trình duyệt chưa hỗ trợ Micro trực tiếp. Bé hãy mở trên Chrome hoặc Edge nhé!</span>`;
        return;
      }
      if (isRecording) {
        if (recognition) recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        recordBtn.classList.add('mic-recording', 'from-red-500', 'to-rose-600');
        recordBtn.innerHTML = `<i class="fa-solid fa-microphone-lines text-2xl"></i><span>Đang lắng nghe bé đọc...</span>`;
      };
      recognition.onerror = () => {
        isRecording = false;
        recordBtn.classList.remove('mic-recording', 'from-red-500', 'to-rose-600');
        recordBtn.innerHTML = `<i class="fa-solid fa-microphone text-2xl"></i><span>Bấm để đọc lại</span>`;
        feedback.innerHTML = `<span class="text-rose-600">Chưa nghe rõ giọng bé, con thử lại nhé!</span>`;
      };
      recognition.onend = () => {
        isRecording = false;
        recordBtn.classList.remove('mic-recording', 'from-red-500', 'to-rose-600');
        recordBtn.innerHTML = `<i class="fa-solid fa-microphone text-2xl"></i><span>Bấm để đọc (Speak)</span>`;
      };

      recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript;
        const targetClean = currentReadingTarget.text.toLowerCase().replace(/[^a-z0-9 ]/gi, '').trim();
        const spokenClean = spokenText.toLowerCase().replace(/[^a-z0-9 ]/gi, '').trim();
        const targetWords = targetClean.split(/\s+/);
        const spokenWords = spokenClean.split(/\s+/);

        let matchCount = 0;
        targetWords.forEach((tw, idx) => {
          const chip = document.getElementById(`word-${idx}`);
          if (!chip) return;
          if (spokenWords.includes(tw) || spokenClean.includes(tw)) {
            chip.className = "word-chip match";
            matchCount++;
          } else {
            chip.className = "word-chip mismatch";
          }
        });

        if (matchCount / targetWords.length >= 0.6 || spokenClean === targetClean || spokenClean.includes(targetClean)) {
          playTone('correct');
          addStars(2);
          feedback.innerHTML = `<span class="text-green-600">🎉 Tuyệt vời! Bé đọc rất chuẩn: "${spokenText}" (+2 ⭐)</span>`;
          speakClear(currentReadingTarget.text, "en", () => {
            setTimeout(nextQuestion, 1600);
          });
        } else {
          playTone('wrong');
          feedback.innerHTML = `<span class="text-rose-600">💡 Bé vừa đọc: "${spokenText}". Hãy nghe lại và thử lại nhé!</span>`;
          speakClear("Listen: " + currentReadingTarget.text, "en");
        }
      };
      recognition.start();
    }

    // Sắp xếp câu
    const ENG_SENTENCE_BUILDER = [
      { targetSentence: "This is my mother", meaning: "Đây là mẹ của tôi", emoji: "👩" },
      { targetSentence: "I have a cat", meaning: "Tôi có một chú mèo", emoji: "🐱" },
      { targetSentence: "The apple is red", meaning: "Quả táo có màu đỏ", emoji: "🍎" }
    ];

    let currentBuiltWords = [];
    let currentTargetWords = [];

    function startEngSentenceBuilderGame() {
      currentMode = 'engSentenceBuilder';
      btnBackSubject.classList.remove('hidden');
      const q = getNextItemFromPool('pool_engSentence', ENG_SENTENCE_BUILDER);
      currentFullSentence = q.targetSentence;
      currentTargetWords = q.targetSentence.split(' ');
      currentBuiltWords = [];
      let shuffledWords = [...currentTargetWords].sort(() => Math.random() - 0.5);
      renderSentenceBuilderUI(q, shuffledWords);
    }

    function renderSentenceBuilderUI(q, poolWords) {
      const selectedHtml = currentBuiltWords.length === 0 
        ? `<div class="text-gray-400 font-bold italic py-4">Chạm vào các từ bên dưới để xếp câu vào đây...</div>`
        : currentBuiltWords.map((w, idx) => `
            <button onclick="removeWordFromBuilt(${idx})" class="slot-word-btn bg-pink-500 hover:bg-pink-600 text-white font-black shadow-md m-1">
              <span class="text-lg">${w}</span>
              <span class="choice-ipa text-[11px] text-pink-100">${getIPA(w)}</span>
            </button>
          `).join('');

      const poolHtml = poolWords.map((w, idx) => `
        <button onclick="addWordToBuilt('${w}', ${idx})" class="slot-word-btn bg-white border-3 border-pink-400 hover:bg-pink-50 text-pink-800 font-black shadow-md m-1">
          <span class="text-lg">${w}</span>
          <span class="choice-ipa text-[11px] text-pink-600">${getIPA(w)}</span>
        </button>
      `).join('');

      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>Chạm các từ để ghép thành câu đúng</span>
          <button class="btn-bounce bg-purple-100 hover:bg-purple-200 text-purple-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.targetSentence}', 'en')">🔊 Nghe</button>
        </div>
        <div class="bg-pink-50/50 border-2 border-dashed border-pink-200 rounded-3xl p-5 w-full max-w-2xl mb-5 flex flex-col items-center">
          <div class="text-5xl mb-2">${q.emoji}</div>
          <div class="text-base font-extrabold text-gray-600 mb-3">Nghĩa tiếng Việt: <b class="text-pink-600">${q.meaning}</b></div>
          <div id="built-container" class="bg-white border-2 border-pink-300 rounded-2xl p-3 w-full min-h-[75px] flex flex-wrap items-center justify-center shadow-inner">
            ${selectedHtml}
          </div>
        </div>
        <div id="pool-container" class="flex flex-wrap items-center justify-center max-w-xl mb-4">
          ${poolHtml}
        </div>
        <div id="builder-feedback" class="text-base font-black min-h-[26px]"></div>
      `;
    }

    function addWordToBuilt(word, poolIndex) {
      currentBuiltWords.push(word);
      const q = ENG_SENTENCE_BUILDER.find(item => item.targetSentence === currentFullSentence);
      let pool = [...currentTargetWords];
      for (let bw of currentBuiltWords) {
        const found = pool.indexOf(bw);
        if (found > -1) pool.splice(found, 1);
      }
      renderSentenceBuilderUI(q, pool);

      if (currentBuiltWords.length === currentTargetWords.length) {
        const builtStr = currentBuiltWords.join(' ');
        const feedback = document.getElementById('builder-feedback');
        if (builtStr === currentFullSentence) {
          playTone('correct');
          addStars(2);
          feedback.innerHTML = `<span class="text-green-600">🎉 Tuyệt vời! Bé đã ghép đúng câu hoàn chỉnh (+2 ⭐)</span>`;
          speakClear(currentFullSentence, "en", () => {
            setTimeout(nextQuestion, 1400);
          });
        } else {
          playTone('wrong');
          feedback.innerHTML = `<span class="text-rose-600">💡 Chưa đúng thứ tự rồi, bé chạm vào từ để chỉnh lại nhé!</span>`;
          speakClear("Try again!", "en");
        }
      }

        </div>
      `;
    }

    const VIET_SPELLING = [
      { question: "Điền chữ thích hợp vào chỗ trống: '...ong lanh'", choices: ["L", "N"], answer: "L" }
    ];

    function startVietSpellingGame() {
      currentMode = 'vietSpelling';
      btnBackSubject.classList.remove('hidden');
      const q = getNextItemFromPool('pool_vietSpelling', VIET_SPELLING);
      currentAnswer = q.answer;

      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>${q.question}</span>
          <button class="btn-bounce bg-green-100 hover:bg-green-200 text-green-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.question}', 'vi')">🔊 Nghe</button>
        </div>
        <div class="bg-green-50/50 border-2 border-dashed border-green-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="text-5xl font-black text-green-600">✏️ l/n - c/k - g/gh</div>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
          ${q.choices.map(c => `<button class="btn-bounce bg-white border-4 border-green-400 hover:bg-green-50 text-green-800 font-black text-xl py-3 rounded-2xl shadow-md transition" onclick="checkChoiceAnswer(this, '${c}')">${c}</button>`).join('')}
        </div>
      `;
    }

    const VIET_IDIOMS = [
      { question: "Thành ngữ nào khuyên chúng ta phải kiên trì, chăm chỉ học tập?", choices: ["Có công mài sắt, có ngày nên kim", "Học một biết mười", "Kính thầy yêu bạn", "Uống nước nhớ nguồn"], answer: "Có công mài sắt, có ngày nên kim" }
    ];

    function startVietIdiomGame() {
      currentMode = 'vietIdiom';
      btnBackSubject.classList.remove('hidden');
      const q = getNextItemFromPool('pool_vietIdiom', VIET_IDIOMS);
      currentAnswer = q.answer;

      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>${q.question}</span>
          <button class="btn-bounce bg-amber-100 hover:bg-amber-200 text-amber-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.question}', 'vi')">🔊 Nghe</button>
        </div>
        <div class="bg-amber-50/50 border-2 border-dashed border-amber-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="text-5xl">📜 🐝 💖</div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-2xl">
          ${q.choices.map(c => `<button class="btn-bounce bg-white border-4 border-amber-400 hover:bg-amber-50 text-amber-800 font-bold text-base md:text-lg p-3 rounded-2xl shadow-md transition" onclick="checkChoiceAnswer(this, '${c}')">${c}</button>`).join('')}
        </div>
      `;
    }

    const VIET_VOCABULARY = [
      { question: "Từ nào dưới đây là từ chỉ tình cảm gia đình?", choices: ["Yêu thương", "Bàn ghế", "Chạy nhảy", "Xanh biếc"], answer: "Yêu thương" }
    ];

    function startVietVocabularyGame() {
      currentMode = 'vietVocabulary';
      btnBackSubject.classList.remove('hidden');
      const q = getNextItemFromPool('pool_vietVocab', VIET_VOCABULARY);
      currentAnswer = q.answer;

      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>${q.question}</span>
          <button class="btn-bounce bg-rose-100 hover:bg-rose-200 text-rose-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.question}', 'vi')">🔊 Nghe</button>
        </div>
        <div class="bg-rose-50/50 border-2 border-dashed border-rose-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="text-5xl">🌳 🏫 👨‍👩‍👧‍👦</div>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
          ${q.choices.map(c => `<button class="btn-bounce bg-white border-4 border-rose-400 hover:bg-rose-50 text-rose-800 font-bold text-base md:text-lg p-3 rounded-2xl shadow-md transition" onclick="checkChoiceAnswer(this, '${c}')">${c}</button>`).join('')}
        </div>
      `;
    }

    /* ========================================================
       9. XỬ LÝ ĐÁP ÁN CHUNG
       ======================================================== */
    function checkChoiceAnswer(btnElement, selected) {
      const isEnglish = (currentSubject === 'eng');

      if (selected === currentAnswer) {
        btnElement.classList.add('!bg-emerald-500', '!text-white', '!border-emerald-600');
        const ipaSpan = btnElement.querySelector('.choice-ipa');
        if (ipaSpan) ipaSpan.classList.add('!text-white');
        
        playTone('correct');
        addStars(1);

        if (currentMode === 'alphabetQuiz') {
          speakClear(currentAnswer, "en", () => {
            setTimeout(nextQuestion, 1100);
          });
          return;
        }

        if (currentMode === 'engVocabMaster') {
          const allBtns = document.querySelectorAll('#vocab-choices-grid button');
          allBtns.forEach(b => b.disabled = true);
          const curObj = currentVocabTarget || ENG_VOCAB_MASTER.find(v => v.word === currentAnswer);
          if (curObj) renderVocabExamples(curObj);
          speakClear(currentAnswer, "en");
          return;
        }

        const allBtns = container.querySelectorAll('button');
        allBtns.forEach(b => b.disabled = true);

        if (currentMode === 'engFillBlank' && currentFullSentence) {
          const sDisp = document.getElementById('sentence-display');
          if (sDisp) sDisp.innerHTML = `<span class="text-green-600">${currentFullSentence}</span>`;
          speakClear(currentFullSentence, "en", () => {
            setTimeout(nextQuestion, 1200);
          });
          return;
        }

        if (currentMode === 'engQAQuiz' && currentFullSentence) {
          speakClear(currentFullSentence, "en", () => {
            setTimeout(nextQuestion, 1400);
          });
          return;
        }

        if (isEnglish) {
          speakClear(currentFullSentence || currentAnswer, "en", () => {
            setTimeout(nextQuestion, 1100);
          });
        } else {
          speakClear("Hoan hô! Đúng rồi!", "vi", () => {
            setTimeout(nextQuestion, 1100);
          });
        }

      } else {
        btnElement.classList.add('!bg-rose-500', '!text-white', '!border-rose-600');
        const ipaSpan = btnElement.querySelector('.choice-ipa');
        if (ipaSpan) ipaSpan.classList.add('!text-white');
        
        playTone('wrong');
        if (isEnglish) {
          speakClear("Try again!", "en");
        } else {
          speakClear("Chưa đúng rồi!", "vi");
        }

        setTimeout(() => {
          btnElement.classList.remove('!bg-rose-500', '!text-white', '!border-rose-600');
          if (ipaSpan) ipaSpan.classList.remove('!text-white');
        }, 1100);
      }
    }

    function nextQuestion() {
      switch(currentMode) {
        // Toán
        case 'mathLogic': startMathLogicGame(); break;
        case 'mathAddSub': startMathAddSubGame(); break;
        case 'mathMult': startMathMultGame(); break;
        case 'mathDiv': startMathDivGame(); break;
        case 'mathGeometry': startMathGeometryGame(); break;
        case 'mathLength': startMathLengthGame(); break;
        case 'mathMassLit': startMathMassLitGame(); break;
        case 'mathClock': startMathClockGame(); break;
        case 'mathWord': startMathWordGame(); break;
        case 'mathFindX': startMathFindXGame(); break;
        // Tiếng Anh
        case 'alphabetQuiz': startAlphabetPhonicsQuiz(); break;
        case 'engVocabMaster': startEngVocabMasterGame(); break;
        case 'engReading': startEngReadingGame(); break;
        case 'engSentenceBuilder': startEngSentenceBuilderGame(); break;
        case 'engSpellingFixer': startEngSpellingFixerGame(); break;
        case 'engFillBlank': startEngFillBlankGame(); break;
        case 'engQAQuiz': startEngQAQuizGame(); break;
        case 'engArticle': startEngArticleGame(); break;
        case 'engPreposition': startEngPrepositionGame(); break;
        case 'engPicMatch': startEngPictureMatchGame(); break;
        case 'engListening': startEngListeningGame(); break;
        // Tiếng Việt
        case 'vietWordTypes': startVietWordTypesGame(); break;
        case 'vietPunctuation': startVietPunctuationGame(); break;
        case 'vietSentenceModel': startVietSentenceModelGame(); break;
        case 'vietSpelling': startVietSpellingGame(); break;
        case 'vietIdiom': startVietIdiomGame(); break;
        case 'vietVocabulary': startVietVocabularyGame(); break;
        default: goHome(); break;
      }
    }
  </script>
