<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vườn Tri Thức Lớp 2 - Toán, Tiếng Anh & Tiếng Việt</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Quicksand & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #FF6584;
      --secondary: #10B981;
      --accent: #F59E0B;
      --blue: #3B82F6;
      --purple: #8B5CF6;
      --dark: #1E293B;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FFE4E6 0%, #E0F2FE 50%, #EDE9FE 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      color: var(--dark);
    }
    .font-cute {
      font-family: 'Quicksand', cursive, sans-serif;
    }
    #app-container {
      background: rgba(255, 255, 255, 0.98);
      width: 100%;
      max-width: 1100px;
      min-height: 760px;
      border-radius: 36px;
      box-shadow: 0 24px 60px rgba(244, 114, 182, 0.2);
      border: 6px solid #FFF;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .card-hover {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-hover:hover {
      transform: translateY(-5px) scale(1.02);
    }
    .btn-bounce:active {
      transform: scale(0.95);
    }
    .mic-recording {
      animation: pulse-red 1.2s infinite;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
    }
    @keyframes pulse-red {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .seq-box {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: #FFF;
      border: 3px solid #3B82F6;
      color: #1D4ED8;
      font-size: 22px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #2563EB;
    }
    .seq-box.target {
      background: #FEF3C7;
      border-color: #F59E0B;
      color: #D97706;
      box-shadow: 0 4px 0 #D97706;
      animation: pulse-target 1.4s infinite;
    }
    @keyframes pulse-target {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .word-chip {
      display: inline-block;
      padding: 6px 14px;
      margin: 4px;
      border-radius: 16px;
      font-size: 26px;
      font-weight: 900;
      background: #FFF;
      border: 3px solid #E2E8F0;
      transition: all 0.2s;
    }
    .word-chip.match {
      background: #DCFCE7;
      color: #166534;
      border-color: #22C55E;
      box-shadow: 0 4px 0 #16A34A;
    }
    .word-chip.mismatch {
      background: #FEE2E2;
      color: #991B1B;
      border-color: #EF4444;
      box-shadow: 0 4px 0 #DC2626;
    }
    .choice-ipa {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-style: italic;
      font-size: 13px;
      font-weight: 600;
      opacity: 0.85;
    }
    .letter-btn {
      width: 54px;
      height: 54px;
      font-size: 26px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      transition: all 0.2s;
    }
    .slot-word-btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 18px;
      min-width: 76px;
      transition: all 0.2s;
    }
    .vocab-pill-red {
      background-color: #FFE4E6;
      color: #E11D48;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 8px;
      display: inline-block;
      margin: 0 2px;
      border: 1px solid #FECDD3;
    }
  </style>
</head>
<body>

  <div id="app-container">

    <!-- 0. MÀN HÌNH BẮT ĐẦU VÀO HỌC -->
    <div id="start-overlay" class="absolute inset-0 bg-gradient-to-br from-pink-500/95 via-rose-400/95 to-purple-600/95 z-50 flex flex-col items-center justify-center p-6 text-center text-white">
      <div class="w-24 h-24 bg-white rounded-3xl flex items-center justify-center text-6xl shadow-2xl mb-4 transform -rotate-6 animate-bounce">
        🐰
      </div>
      <h1 class="text-3xl md:text-4xl font-black font-cute mb-3">🌸 VƯỜN TRI THỨC LỚP 2 🌸</h1>
      <p class="text-base md:text-lg font-bold max-w-lg mb-6 leading-relaxed text-pink-100">
        Chào bạn nhỏ đáng yêu! Chúc con có một buổi học thật vui vẻ và rinh triệu ngôi sao điểm 10 nhé! ✨
      </p>
      <button onclick="initAppAudio()" class="btn-bounce bg-amber-300 hover:bg-amber-200 text-amber-900 text-2xl md:text-3xl font-black px-10 py-4 md:py-5 rounded-full shadow-2xl border-4 border-white transition flex items-center space-x-3">
        <span>🔊 BẮT ĐẦU HỌC NGAY</span>
      </button>
    </div>

    <!-- HEADER: NAV + TIÊU ĐỀ CHÍNH GIỮA + SAO THƯỞNG -->
    <header class="bg-white/95 backdrop-blur-md px-5 py-3 flex justify-between items-center border-b-2 border-pink-100 z-10">
      <div class="flex items-center space-x-2">
        <button onclick="goHome()" class="btn-bounce bg-pink-50 hover:bg-pink-100 text-pink-600 border-2 border-pink-200 font-extrabold px-3 py-1.5 rounded-2xl text-xs md:text-sm flex items-center space-x-1 shadow-sm">
          <span>🏠 Trang chủ</span>
        </button>
        <button id="btn-back-subject" onclick="renderCurrentSubjectMenu()" class="btn-bounce bg-gray-100 hover:bg-gray-200 text-gray-700 border-2 border-gray-200 font-extrabold px-3 py-1.5 rounded-2xl text-xs md:text-sm hidden flex items-center space-x-1 shadow-sm">
          <span>⬅️ Đổi chủ đề</span>
        </button>
      </div>

      <div class="flex items-center justify-center">
        <h1 class="text-lg sm:text-xl md:text-2xl font-black font-cute text-pink-600 tracking-wide drop-shadow-sm flex items-center gap-1.5 cursor-pointer" onclick="goHome()">
          <span>🌸</span>
          <span class="bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 bg-clip-text text-transparent">VƯỜN TRI THỨC LỚP 2</span>
          <span>🌸</span>
        </h1>
      </div>

      <div class="flex items-center space-x-2">
        <div class="flex items-center space-x-1.5 bg-amber-50 border-2 border-amber-300 px-3 py-1 rounded-2xl shadow-inner">
          <span class="text-xl animate-spin" style="animation-duration: 4s;">⭐</span>
          <span id="stars-count" class="text-xl font-black text-amber-600">0</span>
          <span class="text-[11px] font-black text-amber-500 hidden sm:inline">Sao</span>
        </div>
        <button onclick="speakMascotCheer()" class="btn-bounce bg-pink-100 hover:bg-pink-200 text-pink-600 border border-pink-300 px-2.5 py-1.5 rounded-2xl text-xs font-black flex items-center space-x-1 shadow-sm">
          <span>🐰 Cổ vũ</span>
        </button>
      </div>
    </header>

    <!-- KHÔNG GIAN NỘI DUNG CHÍNH -->
    <main id="main-content" class="flex-1 p-4 md:p-6 flex flex-col items-center justify-center text-center overflow-y-auto">
      <!-- Dynamic Rendering -->
    </main>

  </div>

  <script>
    /* ========================================================
       1. ÂM THANH & VOICE SYNTHESIS (TỐI ƯU HÓA GIỌNG ĐỌC NETLIFY)
       ======================================================== */
    let stars = parseInt(localStorage.getItem('stars_vtt_lop2') || '0');
    let currentSubject = null;
    let currentMode = null;
    let currentAnswer = null;
    let currentFullSentence = null;
    let currentReadingTarget = null;
    let currentVocabTarget = null;
    let currentTopicId = null;
    let audioCtx = null;
    const onlineAudioPlayer = new Audio();

    document.getElementById('stars-count').innerText = stars;

    const WELCOME_GREETINGS = [
      "Chào bạn nhỏ đáng yêu! Chúc con có một buổi học thật vui và rinh thật nhiều ngôi sao xinh nhé!",
      "Chào công chúa nhỏ! Hôm nay chúng mình cùng học Toán, Tiếng Anh và Tiếng Việt thật giỏi nhé!",
      "Chào bé yêu! Thỏ trắng rất vui được đồng hành cùng con trong Vườn Tri Thức Lớp 2!"
    ];

    function initAppAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }
      playTone('correct');
      const greet = WELCOME_GREETINGS[Math.floor(Math.random() * WELCOME_GREETINGS.length)];
      speakClear(greet, "vi");
      document.getElementById('start-overlay').style.display = 'none';
      goHome();
    }

    function playTone(type) {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(180, now + 0.22);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    function speakClear(text, lang = 'vi', onEndCallback = null) {
      try {
        onlineAudioPlayer.pause();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();

        const targetLang = (lang === 'en' || lang === 'en-US') ? 'en' : 'vi';
        let cleanText = String(text || '');
        if (targetLang === 'vi') {
          cleanText = cleanText.replace(/\+/g, ' cộng ')
                               .replace(/-/g, ' trừ ')
                               .replace(/×/g, ' nhân ')
                               .replace(/:/g, ' chia ')
                               .replace(/=/g, ' bằng ')
                               .replace(/dm/g, ' đề xi mét ')
                               .replace(/cm/g, ' xăng ti mét ')
                               .replace(/kg/g, ' ki lô gam ');
        }

        const encoded = encodeURIComponent(cleanText.trim());
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${targetLang}&client=tw-ob&q=${encoded}`;

        onlineAudioPlayer.src = ttsUrl;
        onlineAudioPlayer.playbackRate = 0.92;
        
        onlineAudioPlayer.onended = () => {
          if (typeof onEndCallback === 'function') onEndCallback();
        };

        const playPromise = onlineAudioPlayer.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            fallbackWebSpeech(cleanText, targetLang, onEndCallback);
          });
        }
      } catch (err) {
        fallbackWebSpeech(text, lang, onEndCallback);
      }
    }

    function fallbackWebSpeech(text, lang, onEndCallback = null) {
      if (!('speechSynthesis' in window)) {
        if (typeof onEndCallback === 'function') onEndCallback();
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.88;
      utterance.pitch = 1.1;
      utterance.lang = (lang === 'vi' || lang === 'vi-VN') ? 'vi-VN' : 'en-US';
      utterance.onend = () => {
        if (typeof onEndCallback === 'function') onEndCallback();
      };
      window.speechSynthesis.speak(utterance);
    }

    function speakMascotCheer() {
      const cheers = [
        "Bé yêu học chăm chỉ và giỏi giang quá!",
        "Cố lên bạn nhỏ, mỗi câu trả lời đúng là một ngôi sao sáng lấp lánh!",
        "Thỏ trắng chúc bé học thật vui và rinh thật nhiều điểm 10 nhé!"
      ];
      const randomCheer = cheers[Math.floor(Math.random() * cheers.length)];
      speakClear(randomCheer, "vi");
    }

    function addStars(num) {
      stars += num;
      localStorage.setItem('stars_vtt_lop2', stars);
      document.getElementById('stars-count').innerText = stars;
      confetti({ particleCount: 60, spread: 80, origin: { y: 0.75 } });
    }

    /* ========================================================
       2. HỆ THỐNG HÀNG ĐỢI XÁO TRỘN TUẦN HOÀN (KHÔNG TRÙNG LẶP)
       ======================================================== */
    const QUEUE_SYSTEM = {};

    function getNextItemFromPool(poolKey, rawDataArray) {
      if (!QUEUE_SYSTEM[poolKey] || QUEUE_SYSTEM[poolKey].length === 0) {
        const shuffled = [...rawDataArray];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        QUEUE_SYSTEM[poolKey] = shuffled;
      }
      return QUEUE_SYSTEM[poolKey].pop();
    }

    /* ========================================================
       3. 10 CHỦ ĐỀ TỪ VỰNG TIẾNG ANH LỚP 2 (MỞ RỘNG ĐẦY ĐỦ SGK)
       ======================================================== */
    const ENG_TOPICS = [
      { id: 'school', title: '1. School Things', viTitle: 'Đồ dùng học tập', icon: '🎒', desc: 'Book, pen, pencil, ruler, rubber, bag, desk, chair, crayon, board, scissors, glue, notebook, paper...' },
      { id: 'numbers', title: '2. Numbers & Shapes', viTitle: 'Số đếm & Hình học', icon: '🔢', desc: 'One to Twenty, Circle, Square, Triangle, Star...' },
      { id: 'animals', title: '3. Animals World', viTitle: 'Thế giới Động vật', icon: '🐾', desc: 'Dog, cat, bird, duck, fish, elephant, monkey, tiger, lion, bear, rabbit, zebra, giraffe, hippo, crocodile...' },
      { id: 'family', title: '4. Family & People', viTitle: 'Gia đình & Mọi người', icon: '👨‍👩‍👧‍👦', desc: 'Mother, father, brother, sister, baby, grandpa, grandma, teacher, friend, doctor...' },
      { id: 'colors', title: '5. Colors World', viTitle: 'Thế giới Màu sắc', icon: '🎨', desc: 'Red, blue, yellow, green, pink, orange, purple, brown, black, white, rainbow...' },
      { id: 'body', title: '6. Body Parts', viTitle: 'Bộ phận cơ thể', icon: '👀', desc: 'Eye, nose, ear, mouth, hand, foot, arm, leg, head, hair, finger...' },
      { id: 'food', title: '7. Food & Drinks', viTitle: 'Món ăn & Đồ uống', icon: '🍎', desc: 'Apple, banana, orange, milk, water, bread, cake, rice, egg, ice cream, pasta, pizza, popcorn, jam, jelly, juice, yogurt...' },
      { id: 'toys', title: '8. Toys & Games', viTitle: 'Đồ chơi & Trò chơi', icon: '🧸', desc: 'Teddy bear, ball, doll, car, robot, kite, yo-yo, puzzle, bike, seesaw, slide, goal...' },
      { id: 'house', title: '9. House & Home', viTitle: 'Nhà cửa & Phòng ốc', icon: '🏠', desc: 'Living room, bedroom, kitchen, bathroom, table, door, window, garden, sofa, wall...' },
      { id: 'actions', title: '10. Action Verbs', viTitle: 'Hành động quen thuộc', icon: '🏃', desc: 'Run, jump, sing, read, write, draw, dance, swim, sleep, ride, drive, sliding...' }
    ];

    function createVocabObj(topicId, word, ipa, vi, emoji, cat, ex1_en, ex1_vi, ex2_en, ex2_vi, ex3_en, ex3_vi) {
      return {
        topicId, word, ipa, vi, emoji, cat,
        examples: [
          { en: ex1_en, vi: ex1_vi },
          { en: ex2_en, vi: ex2_vi },
          { en: ex3_en, vi: ex3_vi }
        ]
      };
    }

    const ENG_VOCAB_MASTER = [
      // 1. School Things
      createVocabObj('school', 'Book', '/bʊk/', 'Quyển sách', '📖', 'Đồ dùng học tập', 'Open your English book.', 'Hãy mở quyển sách Tiếng Anh ra.', 'This story book is very fun.', 'Quyển sách truyện này rất vui.', 'I read a book every evening.', 'Tôi đọc sách vào mỗi buổi tối.'),
      createVocabObj('school', 'Pen', '/pen/', 'Bút mực', '🖊️', 'Đồ dùng học tập', 'I write with a blue pen.', 'Tôi viết bài bằng cây bút mực màu xanh.', 'This pen writes very smoothly.', 'Cây bút mực này viết rất êm.', 'She has three pens in her box.', 'Bạn ấy có ba cây bút trong hộp.'),
      createVocabObj('school', 'Pencil', '/ˈpen.səl/', 'Bút chì', '✏️', 'Đồ dùng học tập', 'I have a yellow pencil.', 'Tôi có một chiếc bút chì màu vàng.', 'Draw a circle with your pencil.', 'Hãy vẽ một hình tròn bằng bút chì nhé.', 'Sharpen your pencil before writing.', 'Hãy gọt bút chì trước khi viết bài.'),
      createVocabObj('school', 'Ruler', '/ˈruː.lər/', 'Cây thước kẻ', '📏', 'Đồ dùng học tập', 'My ruler is straight.', 'Thước kẻ của tôi rất thẳng.', 'I have a green ruler.', 'Tôi có một cây thước màu xanh.', 'Use the ruler to draw.', 'Dùng thước kẻ để vẽ nhé.'),
      createVocabObj('school', 'Rubber', '/ˈrʌb.ər/', 'Cục tẩy', '🧼', 'Đồ dùng học tập', 'Use a rubber to clean pencil marks.', 'Dùng cục tẩy để xóa vết bút chì.', 'My white rubber is very soft.', 'Cục tẩy trắng của tôi rất mềm.', 'Keep the rubber in your pencil case.', 'Hãy cất cục tẩy vào trong hộp bút.'),
      createVocabObj('school', 'School bag', '/ˈskuːl bæɡ/', 'Cặp sách', '🎒', 'Đồ dùng học tập', 'My school bag is blue and clean.', 'Cặp sách của tôi màu xanh và sạch sẽ.', 'Put books in your school bag.', 'Hãy cất sách vào trong cặp nhé.', 'This is my new school bag.', 'Đây là chiếc cặp sách mới của tôi.'),
      createVocabObj('school', 'Desk', '/desk/', 'Bàn học', '🪵', 'Đồ dùng học tập', 'Sit nicely at your desk.', 'Hãy ngồi ngoan tại bàn học.', 'The desk is very clean.', 'Chiếc bàn học rất sạch sẽ.', 'I put my notebook on the desk.', 'Tôi đặt vở lên trên bàn học.'),
      createVocabObj('school', 'Chair', '/tʃeər/', 'Cái ghế', '🪑', 'Đồ dùng học tập', 'Please sit on the chair.', 'Xin mời ngồi vào ghế.', 'This chair is very comfortable.', 'Chiếc ghế này rất êm ái.', 'A chair has four legs.', 'Cái ghế có 4 cái chân.'),
      createVocabObj('school', 'Crayon', '/ˈkreɪ.ɒn/', 'Bút màu sáp', '🖍️', 'Đồ dùng học tập', 'I color the sun with a crayon.', 'Tôi tô màu mặt trời bằng bút sáp.', 'She has a big crayon box.', 'Bạn ấy có một hộp bút sáp lớn.', 'This red crayon is bright.', 'Cây sáp màu đỏ này rất tươi.'),
      createVocabObj('school', 'Board', '/bɔːd/', 'Bảng lớp', '📋', 'Đồ dùng học tập', 'Look at the board, please.', 'Xin mời các em nhìn lên bảng.', 'Teacher writes on the board.', 'Cô giáo viết bài lên bảng.', 'Clean the board after class.', 'Hãy lau bảng sau giờ học.'),

    function getIPA(word) {
      if (!word) return '';
      const found = ENG_VOCAB_MASTER.find(v => v.word.toLowerCase() === word.toLowerCase());
      if (found) return found.ipa;
      if (EXTRA_IPA[word] || EXTRA_IPA[word.toLowerCase()]) return EXTRA_IPA[word] || EXTRA_IPA[word.toLowerCase()];
      const clean = word.replace(/[^a-zA-Z]/g, '').toLowerCase();
      const fallback = ENG_VOCAB_MASTER.find(v => v.word.toLowerCase() === clean);
      return fallback ? fallback.ipa : (EXTRA_IPA[clean] || '');
    }

    function highlightWordInSentence(sentence, targetWord) {
      if (!sentence || !targetWord) return sentence;
      const regex = new RegExp(`\\b(${targetWord}[a-z]*)\\b`, 'gi');
      return sentence.replace(regex, `<span class="vocab-pill-red">$1</span>`);
    }

      currentTopicId = topicId;
      vocabHistory = [];
      vocabHistoryIndex = -1;
      startEngVocabMasterGame(null, false);
    }

    let vocabHistory = [];
    let vocabHistoryIndex = -1;

    function startEngVocabMasterGame(targetWordObj = null, isNav = false) {
      currentMode = 'engVocabMaster';
      btnBackSubject.classList.remove('hidden');

      const topicPool = currentTopicId 
        ? ENG_VOCAB_MASTER.filter(v => v.topicId === currentTopicId)
        : ENG_VOCAB_MASTER;

      let target;
      if (targetWordObj) {
        target = targetWordObj;
      } else if (vocabHistoryIndex >= 0 && vocabHistoryIndex < vocabHistory.length - 1 && isNav) {
        vocabHistoryIndex++;
        target = vocabHistory[vocabHistoryIndex];
      } else {
        const poolKey = 'pool_engVocab_' + (currentTopicId || 'all');
        target = getNextItemFromPool(poolKey, topicPool);
        vocabHistory.push(target);
        vocabHistoryIndex = vocabHistory.length - 1;
      }

      currentVocabTarget = target;
      currentAnswer = target.word;

      let choices = [target.word];
      const otherVocab = ENG_VOCAB_MASTER.filter(v => v.word !== target.word);
      while (choices.length < 4 && otherVocab.length > 0) {
        let r = otherVocab[Math.floor(Math.random() * otherVocab.length)].word;
        if (!choices.includes(r)) choices.push(r);
      }
      choices.sort(() => Math.random() - 0.5);

      const curTopicObj = ENG_TOPICS.find(t => t.id === target.topicId);
      const topicNameDisplay = curTopicObj ? `${curTopicObj.icon} ${curTopicObj.title} (${curTopicObj.viTitle})` : target.cat;

      container.innerHTML = `

    function toggleVoiceRecording() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recordBtn = document.getElementById('record-btn');

      if (!SpeechRecognition) {
        feedback.innerHTML = `<span class="text-rose-600">Trình duyệt chưa hỗ trợ Micro trực tiếp. Bé hãy mở trên Chrome hoặc Edge nhé!</span>`;
        return;
      }
      if (isRecording) {
        if (recognition) recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        recordBtn.classList.add('mic-recording', 'from-red-500', 'to-rose-600');
        recordBtn.innerHTML = `<i class="fa-solid fa-microphone-lines text-2xl"></i><span>Đang lắng nghe bé đọc...</span>`;
      };
      recognition.onerror = () => {
        isRecording = false;
        recordBtn.classList.remove('mic-recording', 'from-red-500', 'to-rose-600');
        recordBtn.innerHTML = `<i class="fa-solid fa-microphone text-2xl"></i><span>Bấm để đọc lại</span>`;
        feedback.innerHTML = `<span class="text-rose-600">Chưa nghe rõ giọng bé, con thử lại nhé!</span>`;
      };
      recognition.onend = () => {
        isRecording = false;
        recordBtn.classList.remove('mic-recording', 'from-red-500', 'to-rose-600');
        recordBtn.innerHTML = `<i class="fa-solid fa-microphone text-2xl"></i><span>Bấm để đọc (Speak)</span>`;
      };

      recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript;
        const targetClean = currentReadingTarget.text.toLowerCase().replace(/[^a-z0-9 ]/gi, '').trim();
        const spokenClean = spokenText.toLowerCase().replace(/[^a-z0-9 ]/gi, '').trim();
        const targetWords = targetClean.split(/\s+/);
        const spokenWords = spokenClean.split(/\s+/);

        let matchCount = 0;
        targetWords.forEach((tw, idx) => {
          const chip = document.getElementById(`word-${idx}`);
          if (!chip) return;
          if (spokenWords.includes(tw) || spokenClean.includes(tw)) {
            chip.className = "word-chip match";
            matchCount++;
          } else {
            chip.className = "word-chip mismatch";
          }
        });

        if (matchCount / targetWords.length >= 0.6 || spokenClean === targetClean || spokenClean.includes(targetClean)) {
          playTone('correct');
          addStars(2);
          feedback.innerHTML = `<span class="text-green-600">🎉 Tuyệt vời! Bé đọc rất chuẩn: "${spokenText}" (+2 ⭐)</span>`;
          speakClear(currentReadingTarget.text, "en", () => {
            setTimeout(nextQuestion, 1600);
          });
        } else {
          playTone('wrong');
          feedback.innerHTML = `<span class="text-rose-600">💡 Bé vừa đọc: "${spokenText}". Hãy nghe lại và thử lại nhé!</span>`;

    function checkChoiceAnswer(btnElement, selected) {
      const isEnglish = (currentSubject === 'eng');

      if (selected === currentAnswer) {
        btnElement.classList.add('!bg-emerald-500', '!text-white', '!border-emerald-600');
        const ipaSpan = btnElement.querySelector('.choice-ipa');
        if (ipaSpan) ipaSpan.classList.add('!text-white');
        
        playTone('correct');
        addStars(1);

        if (currentMode === 'engVocabMaster') {
          const allBtns = document.querySelectorAll('#vocab-choices-grid button');
          allBtns.forEach(b => b.disabled = true);
          const curObj = currentVocabTarget || ENG_VOCAB_MASTER.find(v => v.word === currentAnswer);
          if (curObj) renderVocabExamples(curObj);
          speakClear(currentAnswer, "en");
          return;
        }

        const allBtns = container.querySelectorAll('button');
        allBtns.forEach(b => b.disabled = true);

        if (currentMode === 'engFillBlank' && currentFullSentence) {
          const sDisp = document.getElementById('sentence-display');
          if (sDisp) sDisp.innerHTML = `<span class="text-green-600">${currentFullSentence}</span>`;
          speakClear(currentFullSentence, "en", () => {
            setTimeout(nextQuestion, 1200);
          });
          return;
        }

        if (currentMode === 'engQAQuiz' && currentFullSentence) {
          speakClear(currentFullSentence, "en", () => {
            setTimeout(nextQuestion, 1400);
          });
          return;
        }

        if (isEnglish) {
          speakClear(currentFullSentence || currentAnswer, "en", () => {
            setTimeout(nextQuestion, 1100);
          });
        } else {
          speakClear("Hoan hô! Đúng rồi!", "vi", () => {
            setTimeout(nextQuestion, 1100);
          });
        }

      } else {
        btnElement.classList.add('!bg-rose-500', '!text-white', '!border-rose-600');
        const ipaSpan = btnElement.querySelector('.choice-ipa');
        if (ipaSpan) ipaSpan.classList.add('!text-white');
        
        playTone('wrong');
        if (isEnglish) {
          speakClear("Try again!", "en");
        } else {
          speakClear("Chưa đúng rồi!", "vi");
        }

        setTimeout(() => {
          btnElement.classList.remove('!bg-rose-500', '!text-white', '!border-rose-600');
          if (ipaSpan) ipaSpan.classList.remove('!text-white');
        }, 1100);
      }
    }

        case 'mathAddSub': startMathAddSubGame(); break;
        case 'mathMult': startMathMultGame(); break;
        case 'mathDiv': startMathDivGame(); break;
        case 'mathGeometry': startMathGeometryGame(); break;
        case 'mathLength': startMathLengthGame(); break;
        case 'mathMassLit': startMathMassLitGame(); break;
        case 'mathClock': startMathClockGame(); break;
        case 'mathWord': startMathWordGame(); break;
        case 'mathFindX': startMathFindXGame(); break;
        // Tiếng Anh
        case 'engAlphabet': openAlphabetMenu(currentAlphabetIndex); break;
